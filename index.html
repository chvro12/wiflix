<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/weflix.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>
  <script>
    function onTurnstileLoad() {
      window._turnstileReady = true;
      window.dispatchEvent(new Event('turnstile-ready'));
    }
  </script>

  <!-- Web App / PWA -->
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WeFlix" />
  <link rel="apple-touch-icon" href="/weflix.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Primary SEO -->
  <title>WeFlix — Films et séries en streaming</title>
  <meta name="description"
    content="WeFlix vous permet de découvrir des films et des séries, de parcourir les genres et de lancer votre séance en ligne." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="keywords"
    content="weflix, WeFlix, streaming, films en ligne, séries en ligne, films tendance, meilleures séries, application WeFlix" />
  <meta name="author" content="WeFlix" />
  <meta name="application-name" content="WeFlix" />
  <link rel="canonical" href="https://www.weflix.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WeFlix" />
  <meta property="og:url" content="https://www.weflix.app/" />
  <meta property="og:title" content="WeFlix — Films et séries en streaming" />
  <meta property="og:description"
    content="Découvrez et regardez vos films et séries sur WeFlix." />
  <meta property="og:image" content="https://www.weflix.app/weflix2.png" />
  <meta property="og:image:alt" content="WeFlix — Films et séries en streaming" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="fr_FR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@weflixapp" />
  <meta name="twitter:creator" content="@weflixapp" />
  <meta name="twitter:title" content="WeFlix — Films et séries en streaming" />
  <meta name="twitter:description"
    content="Découvrez et regardez vos films et séries sur WeFlix." />
  <meta name="twitter:image" content="https://www.weflix.app/weflix2.png" />
  <meta name="twitter:image:alt" content="WeFlix — Films et séries en streaming" />

  <!-- JSON-LD: WebSite schema with Sitelinks Searchbox -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.weflix.app/#website",
      "name": "WeFlix",
      "alternateName": ["WeFlix App", "weflix"],
      "url": "https://www.weflix.app/",
      "description": "WeFlix est une plateforme de streaming de films et de séries.",
      "inLanguage": "fr-FR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.weflix.app/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <!-- JSON-LD: Organization (Brand Entity) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.weflix.app/#organization",
      "name": "WeFlix",
      "alternateName": "WeFlix App",
      "url": "https://www.weflix.app/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.weflix.app/weflix.svg",
        "width": 512,
        "height": 512
      },
      "description": "WeFlix est une plateforme de streaming de films et de séries.",
      "sameAs": [
        "https://www.weflix.app"
      ]
    }
    </script>

  <!-- JSON-LD: WebApplication (Product Entity) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "@id": "https://www.weflix.app/#webapp",
      "name": "WeFlix",
      "alternateName": ["WeFlix App", "weflix streaming"],
      "url": "https://www.weflix.app/",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Web, Android, iOS",
      "browserRequirements": "JavaScript requis",
      "description": "WeFlix permet de parcourir des films et des séries par genre et de lancer une séance en ligne.",
      "screenshot": "https://www.weflix.app/weflix2.png",
      "featureList": "Streaming, Films, Séries, Animation, Séries coréennes, Recherche, Navigation par genre",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@id": "https://www.weflix.app/#organization"
      }
    }
    </script>

  <meta name='dmca-site-verification' content='NnVjSnA3ZGtacC9vVGJ2K1d6SHQvdz090' />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
