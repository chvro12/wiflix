name: Deploy r2-importer VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/media-stack/r2-importer/**'
      - 'infra/media-stack/compose.yaml'
      - '.github/workflows/deploy-r2-importer.yml'

concurrency:
  group: deploy-r2-importer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          if [[ -z "${VPS_SSH_KEY//[[:space:]]/}" ]]; then
            echo "Le secret WEFLIX_VPS_SSH_KEY est vide." >&2
            exit 1
          fi
          KEY_FILE=~/.ssh/weflix_vps_ed25519
          if printf '%s' "$VPS_SSH_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          elif printf '%s' "$VPS_SSH_KEY" | tr -d '\n\r ' | base64 -d > "$KEY_FILE" 2>/dev/null \
            && ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "Clé SSH décodée depuis base64."
          else
            printf '%b' "$VPS_SSH_KEY" > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          VPS_SSH_KEY: ${{ secrets.WEFLIX_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.WEFLIX_VPS_HOST || '78.138.45.49' }}
          VPS_USER: ${{ secrets.WEFLIX_VPS_USER || 'weflix' }}

      - name: Sync stack and rebuild r2-importer
        run: |
          RSYNC_RSH='ssh -i ~/.ssh/weflix_vps_ed25519 -o StrictHostKeyChecking=no'
          rsync -az -e "$RSYNC_RSH" --exclude 'data/library/***' --exclude 'data/downloads/***' \
            infra/media-stack/ "${VPS_USER}@${VPS_HOST}:/opt/weflix/infra/media-stack/"
          ssh -i ~/.ssh/weflix_vps_ed25519 -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" 'set -e
            cd /opt/weflix
            git fetch origin main || true
            git reset --hard origin/main || true
            cd infra/media-stack
            docker compose --env-file .env build r2-importer
            docker compose --env-file .env up -d --no-deps r2-importer
            sleep 12
            curl -fsS http://127.0.0.1:8788/health | python3 -m json.tool | head -30
          '
        env:
          VPS_HOST: ${{ secrets.WEFLIX_VPS_HOST || '78.138.45.49' }}
          VPS_USER: ${{ secrets.WEFLIX_VPS_USER || 'weflix' }}

      - name: Retry failed movie imports
        run: |
          ORIGIN_TOKEN=$(ssh -i ~/.ssh/weflix_vps_ed25519 -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" 'set -a; source /opt/weflix/infra/media-stack/.env 2>/dev/null || true; source /opt/weflix/.env.local 2>/dev/null || true; set +a; printf "%s" "${MEDIA_ORIGIN_TOKEN:-${R2_IMPORTER_PASSWORD:-}}"')
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer ${ORIGIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"includePreload":true,"force":true}' \
            https://origin.wiflix.site/maintenance/retry-errors | python3 -m json.tool
        env:
          VPS_HOST: ${{ secrets.WEFLIX_VPS_HOST || '78.138.45.49' }}
          VPS_USER: ${{ secrets.WEFLIX_VPS_USER || 'weflix' }}
